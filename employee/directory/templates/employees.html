<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .full-time {
            color: green;
        }
        .part-time {
            color:red;
        }
    </style>
</head>
<body>
   <h1>employee directory</h1>
   {% if employees %} 
      {% for employee in employees %}

         <div>
                <h3>{{ employee.name }}</h3>
                <p>Job Title: {{ employee.job_title }}</p>
                <p>Salary: ₹{{ employee.salary }}</p>

                {% if employee.full_time %}
                    <p class="full-time">Full-Time</p>
                {% else %}
                    <p class="part-time">Part-Time</p>
                {% endif %}
            </div>

        {% endfor %}

    {% else %}

        <p>No employees available.</p>

    {% endif %}
</body>
</html>
